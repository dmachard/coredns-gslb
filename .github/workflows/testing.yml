name: Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read # for actions/checkout to fetch code
  pull-requests: read  # for golangci/golangci-lint-action to fetch pull requests

env:
  GOLANGCI_LINT_VERSION: "v2.12.2"
  
jobs:
  unit_tests:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        go-version: ['1.25']
        
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v6

    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        # workaround: when the files to be extracted are already present, 
        # tar extraction in Golangci Lint fails with the "File exists"
        # https://github.com/golangci/golangci-lint-action/issues/807
        cache: false

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: "${{ env.GOLANGCI_LINT_VERSION }}"
        args: --timeout 3m --verbose

    - name: Test
      run: make test-unit

    - name: Line of Code
      run: make stats

    - name: Bench
      run: go test -bench .

  integ_tests_basic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose dnsutils jq

      - name: Run Basic Integration Tests
        run: make test-integ-basic

  integ_tests_ha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose dnsutils jq

      - name: Run HA Integration Tests
        run: make test-integ-ha
